# Issue #65 view-only default drop-in for hermes-x11vnc.service
# (NEW VPS ionos-n8n-new; installed at
#  /etc/systemd/system/hermes-x11vnc.service.d/viewonly-default.conf)
#
# Canonical repo copy: tools/hermes-x11vnc-viewonly-default-drop-in-v1.conf
#
# Semantics:
# - marker /run/hermes-vnc/vnc-interactive ABSENT (boot default, restart default,
#   or after `hermes-vnc-mode view`)  -> x11vnc runs WITH -viewonly (VIEW_ONLY)
# - marker PRESENT (only via explicit `hermes-vnc-mode interactive`) -> input enabled
#
# All original x11vnc arguments are preserved byte-for-byte; -viewonly is the only
# added flag, and only in the default branch. /run is tmpfs, so the interactive
# marker never survives reboot: BOOT_DEFAULT=VIEW_ONLY is structural.
#
# Rollback: delete this drop-in, `systemctl daemon-reload`,
# `systemctl restart hermes-x11vnc` (pre-change unit preserved at
# /etc/systemd/system/hermes-x11vnc.service.bak-issue65 on the VPS).

[Service]
ExecStart=
ExecStart=/bin/sh -c 'if [ -e /run/hermes-vnc/vnc-interactive ]; then exec /usr/bin/x11vnc -display :99 -rfbauth /home/hermes-test/.hermes/vnc/passwd -rfbport 5900 -localhost -forever -shared -ncache 0; else exec /usr/bin/x11vnc -display :99 -rfbauth /home/hermes-test/.hermes/vnc/passwd -rfbport 5900 -localhost -forever -shared -ncache 0 -viewonly; fi'
