# TEST / SPIKE TEMPLATE — NOT ACTIVE
#
# D-0023-W offline/config artifact; reconciled by D-0024 preflight evidence.
# Does NOT authorize install, start, OAuth, credential access, HTTP, or inference.
# Current D-0024 runtime priority aliases (max 1 GLM + 1 Codex call; max 2 total):
#   planner-glm-pilot
#   planner-codex-pilot
# Qwen remains represented only for offline/static portability and is runtime-deferred.
#   planner-qwen-pilot
#
# No runtime degrade chain. No service auto-start. No package manager install steps.
# Secrets must be supplied only via local environment references — never literals.

model_list:
  # --- Qwen 3.8 37B local (DEFERRED RUNTIME; offline/static portability only) ---
  # Exact target: Qwen 3.8 37B. No silent 27B substitution. No model pull/download.
  - model_name: planner-qwen-pilot
    litellm_params:
      model: ollama/<EXACT_QWEN_38_37B_RUNTIME_MODEL_ID>
      api_base: os.environ/OLLAMA_API_BASE
      # optional: api_key: os.environ/OLLAMA_API_KEY  (only if local auth required)

  # --- GLM 5.3 via Z.AI Coding Plan ---
  # D-0024 installed-package evidence: native LiteLLM route is zai/glm-5.3.
  # Coding endpoint MUST remain explicit because LiteLLM's native Z.AI default is General API.
  - model_name: planner-glm-pilot
    litellm_params:
      model: zai/glm-5.3
      api_base: https://api.z.ai/api/coding/paas/v4
      api_key: os.environ/ZAI_CODING_API_KEY

  # --- Codex via ChatGPT subscription OAuth (Responses mode) ---
  # D-0024 exact authenticated model from custom CHATGPT_TOKEN_DIR catalog metadata.
  # Do NOT substitute OpenAI Platform API key / paid API fallback.
  # Runtime must set CHATGPT_TOKEN_DIR / CHATGPT_AUTH_FILE to the operator auth store.
  - model_name: planner-codex-pilot
    litellm_params:
      model: chatgpt/gpt-5.6-sol
      # OAuth/device material stays local; never commit tokens.

# Pilot policy notes (documentation only — not a live router):
# - stream false
# - retry count 0
# - no planner auto-degrade
# - no gateway auto-degrade
# - max 1 GLM inference + 1 Codex OAuth inference; max 2 total for current D-0024 priority suite
# - Qwen inference 0 until a later explicit resume

litellm_settings:
  drop_params: true
  # intentionally no degrade chain / no multi-backend auto-route for the pilot template
